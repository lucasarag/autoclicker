name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AutoClick.app
        run: |
          python -m venv .venv-build
          .venv-build/bin/pip install -q pyinstaller
          .venv-build/bin/pyinstaller --noconfirm --clean --windowed \
            --name AutoClick --osx-bundle-identifier com.local.autoclicker \
            autoclicker.py
          xattr -cr dist/AutoClick.app
          codesign --force --deep --sign - dist/AutoClick.app
          codesign --verify --deep --strict dist/AutoClick.app
          ditto -c -k --keepParent dist/AutoClick.app dist/AutoClick-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClick-macOS
          path: dist/AutoClick-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build AutoClicker.exe
        shell: cmd
        run: |
          python -m pip install -q pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name AutoClicker autoclicker.py
      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-Windows
          path: dist/AutoClicker.exe
